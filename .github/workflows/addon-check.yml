# Proves Media Hub still installs as a Home Assistant add-on, on every push and pull request.
# GitHub emails the owner when a run fails.
name: Add-on check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Home Assistant add-on linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: frenck/action-addon-linter@v2.21.2
        with:
          path: ./media_hub

  build:
    name: Build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read the add-on version
        id: version
        run: echo "version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' media_hub/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      # The Dockerfile runs the Go tests, so a failing test fails this build.
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ./media_hub
          platforms: ${{ matrix.platform }}
          build-args: BUILD_VERSION=${{ steps.version.outputs.version }}
          push: false
