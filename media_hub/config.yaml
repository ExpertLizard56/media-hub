name: Media Hub
version: "0.22.2"
slug: media_hub
url: https://github.com/ExpertLizard56/media-hub
description: Updates and logs for the TV and Music apps, antenna channels, and a music library.
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
# With the watchdog on, Home Assistant restarts the hub if it stops answering here, not only if it exits.
watchdog: http://[HOST]:8765/health
# On the home network: finding the HDHomeRun is a broadcast, which has to reach the LAN.
# The hub serves the apps on port 8765. Host networking also reaches https_port when it is set, so
# there is no ports section to change for it.
host_network: true
# Its own page in Home Assistant (admin.go): connecting a device, the devices' logs, the hub's logs by section.
ingress: true
ingress_port: 8765
ingress_entry: admin/
panel_icon: mdi:server-network
panel_title: Media Hub
map:
  - share:rw
  # The certificate of https_domain, kept renewed by another add-on (https.go).
  - ssl:ro
# To leave notices in Home Assistant's notifications and send them to phones (publicip.go): needs
# Home Assistant's mobile app for the phones.
homeassistant_api: true
# hdhomerun: the HDHomeRun's address on the home network (an IP or a name); empty finds it automatically.
# torbox_api_key: TorBox, Settings, API (downloads new music; musicfetch.go). Only for getting albums.
# nzbgeek_api_key: NZBgeek, your profile, API key (searches Usenet for albums to get).
# remote_address: the hub's address from the internet (name:port); apps learn it as they pair. Empty: home only.
# Phone notices go to every notify service whose name starts with mobile_app_ (publicip.go). Phones
# stay quiet until the time in /share/phone-quiet-until.txt (share above), while Home Assistant's own
# notice still appears.
# https_port: a second port that serves the same hub over HTTPS with a certificate from another
# add-on (0 = off). https_domain: that certificate's folder in /ssl, as
# /ssl/<https_domain>/fullchain.pem and privkey.pem, read again when they are renewed. Both must be
# set to turn it on; port 8765 keeps serving as before, with the same access rules.
# tmdb_api_key: TMDB's API key (or read access token) for the movie catalog and its home-only Stremio
# test add-on at /stremio/manifest.json (catalog.go, stremio.go). Empty: no catalog.
# The keys are typed in here; they never leave the hub (the apps never see them).
options:
  hdhomerun: ""
  torbox_api_key: ""
  nzbgeek_api_key: ""
  remote_address: ""
  https_port: 0
  https_domain: ""
  tmdb_api_key: ""
schema:
  hdhomerun: str?
  torbox_api_key: password?
  nzbgeek_api_key: password?
  remote_address: str?
  https_port: int(0,65535)?
  https_domain: str?
  tmdb_api_key: password?
